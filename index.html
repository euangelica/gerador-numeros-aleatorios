<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Números Aleatórios</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho-site">
        <!-- Lado Esquerdo: Logo -->
        <a href="inicio.html" class="logo">Gerador de Numeros</a>

        <!-- Lado Direito: Menus e Botões -->
        <div class="menu-direito">
            
            <!-- Links de navegação -->
           <nav class="links-menu">
    <a href="inicio.html">Início</a>
</nav>
            
        </div>
    </header>
    
    <main>

        <!-- NOVA CAIXA BRANCA QUE ABRAÇA TUDO -->
        <div class="cartao-principal">
            
            <h1>Gerador de Números</h1>
            
            <!-- Painel cinza com os quadradinhos -->
            <div class="painel-sorteio">
                <span>Sortear</span>
                <button id="btn-menos" class="quadrado-btn">-</button>
                <input type="number" id="quantidade" class="quadrado-input texto-rosa" value="1" min="1">
                <button id="btn-mais" class="quadrado-btn">+</button>
                <span>número entre</span>
                <input type="number" id="minimo" class="quadrado-input" value="1">
                <span>e</span>
                <input type="number" id="maximo" class="quadrado-input texto-rosa" value="100">
            </div>

            <!-- Local onde os resultados anteriores vão se empilhar -->
            <div id="historico-resultados" class="historico-container"></div>
            
            <!-- Botão principal -->
            <button id="botao-gerar" class="btn-principal">Sortear</button>

        </div>
    </main>

    <!-- Estrutura da Janela Flutuante (Modal) -->
    <div id="modal-resultado" class="modal-overlay">
        <div class="modal-content">
            <!-- Parte rosa superior do modal -->
            <div class="modal-header">
                <button id="btn-fechar-modal" class="fechar-btn">&times;</button>
                <div class="icone-hash">#</div>
                <h2>Resultado</h2>
            </div>
            
            <!-- Parte branca inferior do modal -->
            <div class="modal-body">
                <div id="numero-sorteado-modal" class="numero-destaque">0</div>
            </div>
            
            <div class="modal-footer">
                <button id="btn-sortear-novamente" class="btn-principal" style="width: 80%; margin-bottom: 20px;">
                    Sortear de novo
                </button>
            </div>
        </div>
    </div>
    
    <!-- RODAPÉ DO SITE -->
    <footer class="rodape-site">
    <p>&copy; 2026 Gerador de Números. Todos os direitos reservados.</p>
    <p>Desenvolvido com dedicação por <a href="https://www.linkedin.com/in/angelicasouzasantos" target="_blank" class="link-rodape">Angelica</a> ❤️ </p>
</footer>

    <!-- Link para o arquivo JavaScript (sempre no final do body) -->
    <script src="script.js"></script>
</body>
</html>
